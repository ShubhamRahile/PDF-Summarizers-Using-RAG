{% extends "base.html" %}{% block content %}<p class="eyebrow">EVIDENCE-GROUNDED Q&A</p><h1>Ask your documents</h1><form method="post" class="question-form"><label>Scope<select name="document_id"><option value="">All documents</option>{% for d in docs %}<option value="{{ d.id }}" {% if selected and selected|string == d.id|string %}selected{% endif %}>{{ d.title }}</option>{% endfor %}</select></label><label>Question<textarea name="question" required placeholder="What are the main findings and recommendations?">{{ question }}</textarea></label><button class="button">Find evidence and answer</button></form>{% if answer %}<section class="answer panel"><h2>Answer</h2><p>{{ answer }}</p>{% if evidence %}<h3>Retrieved evidence</h3>{% for e in evidence %}<blockquote><small>{{ e.title }} · page {{ e.page }}</small>{{ e.text }}</blockquote>{% endfor %}{% endif %}</section>{% endif %}{% endblock %}
