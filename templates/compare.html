{% extends "base.html" %}{% block content %}<p class="eyebrow">MULTI-DOCUMENT ANALYSIS</p><h1>Compare documents</h1><form method="post" class="question-form"><label>Documents<select name="document_ids" multiple size="8" required>{% for d in docs %}<option value="{{ d.id }}">{{ d.title }}</option>{% endfor %}</select></label><label>Comparison question<textarea name="question">Compare the main purpose, findings, and recommendations.</textarea></label><button class="button">Compare with evidence</button></form>{% if answer %}<section class="answer panel"><h2>Comparison</h2><p>{{ answer }}</p></section>{% endif %}{% endblock %}
