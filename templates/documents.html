{% extends "base.html" %}{% block content %}<div class="page-head"><div><p class="eyebrow">LIBRARY</p><h1>All documents</h1></div><form><input name="q" value="{{ query }}" placeholder="Search title or category"><button class="button">Search</button></form></div><div class="grid">{% for doc in documents %}<a class="card" href="{{ url_for('main.document', doc_id=doc.id) }}"><span class="tag">{{ doc.category }}</span><h3>{{ doc.title }}</h3><p>{{ doc.insight }}</p><small>{{ doc.pages }} pages · {{ doc.word_count }} words</small></a>{% else %}<p>No matching documents.</p>{% endfor %}</div>{% endblock %}
