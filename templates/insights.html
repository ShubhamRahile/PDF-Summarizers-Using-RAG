{% extends "base.html" %}{% block content %}<p class="eyebrow">AT A GLANCE</p><h1>Document insights</h1><p class="muted">Short, source-derived descriptions generated during indexing.</p><div class="insight-list">{% for doc in documents %}<div class="panel"><span class="tag">{{ doc.category }}</span><h3>{{ doc.title }}</h3><p>{{ doc.insight }}</p><a href="{{ url_for('main.document', doc_id=doc.id) }}">Explore document →</a></div>{% endfor %}</div>{% endblock %}
